<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Picker</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .header {
      color: #333;
      margin-bottom: 20px;
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 400px;
    }
    .emoji-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .emoji-item:hover {
      background-color: #e8e8e8;
    }
    .emoji {
      font-size: 24px;
      display: block;
      margin-bottom: 5px;
    }
    .name {
      font-size: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1 class="header">🎉 Emoji Picker</h1>
  
  <div class="emoji-grid">
    <div class="emoji-item" onclick="copyEmoji('😀')">
      <span class="emoji">😀</span>
      <span class="name">grinning</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('😃')">
      <span class="emoji">😃</span>
      <span class="name">big eyes</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('😄')">
      <span class="emoji">😄</span>
      <span class="name">smiling eyes</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('😁')">
      <span class="emoji">😁</span>
      <span class="name">beaming</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('🥰')">
      <span class="emoji">🥰</span>
      <span class="name">hearts</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('😍')">
      <span class="emoji">😍</span>
      <span class="name">heart-eyes</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('🤩')">
      <span class="emoji">🤩</span>
      <span class="name">star-struck</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('😘')">
      <span class="emoji">😘</span>
      <span class="name">kiss</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('🤔')">
      <span class="emoji">🤔</span>
      <span class="name">thinking</span>
    </div>
    <div class="emoji-item" onclick="copyEmoji('👋')">
      <span class="emoji">👋</span>
      <span class="name">waving</span>
    </div>
  </div>

  <script>
    function copyEmoji(emoji) {
      // Try to copy to clipboard
      navigator.clipboard.writeText(emoji).then(() => {
        console.log('Copied:', emoji);
        showMessage(emoji + ' copied!');
      }).catch(err => {
        console.error('Copy failed:', err);
        showMessage('Copy failed');
      });
    }

    function showMessage(text) {
      const existing = document.getElementById('message');
      if (existing) existing.remove();
      
      const msg = document.createElement('div');
      msg.id = 'message';
      msg.textContent = text;
      msg.style.cssText = `
        position: fixed;
        top: 10px;
        right: 10px;
        background: #333;
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 1000;
      `;
      document.body.appendChild(msg);
      
      setTimeout(() => {
        if (msg.parentNode) msg.parentNode.removeChild(msg);
      }, 2000);
    }
  </script>
</body>
</html>
