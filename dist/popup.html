<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Picker</title>
  <style>
    body {
      width: 350px;
      height: 500px;
      margin: 0;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }
    
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #2d3748;
    }
    
    .search-container {
      margin-bottom: 15px;
    }
    
    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .category {
      padding: 4px 8px;
      background: #e2e8f0;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .category:hover, .category.active {
      background: #3182ce;
      color: white;
    }
    
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }
    
    .emoji-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .emoji-item:hover {
      background: #f0f4f7;
      border-color: #3182ce;
      transform: translateY(-1px);
    }
    
    .emoji {
      font-size: 20px;
      margin-bottom: 2px;
    }
    
    .emoji-name {
      font-size: 9px;
      color: #718096;
      text-align: center;
      line-height: 1.2;
    }
    
    .message {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #38a169;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  </div>

    let currentCategory = 'all';
    let currentEmojis = [];
    
    function getAllEmojis() {
      return Object.values(emojis).flat();
    }
    
    function showMessage(text) {
      const existing = document.getElementById('message');
      if (existing) existing.remove();
      
      const msg = document.createElement('div');
      msg.id = 'message';
      msg.className = 'message';
      msg.textContent = text;
      document.body.appendChild(msg);
      
      setTimeout(() => {
        if (msg.parentNode) msg.parentNode.removeChild(msg);
      }, 2000);
    }
    
    function copyEmoji(emoji) {
      // Try to send message to content script for insertion
      chrome.tabs.query({active: true, currentWindow: true}, function(tabs) {
        chrome.tabs.sendMessage(tabs[0].id, {
          type: 'INSERT_EMOJI',
          emoji: emoji
        }, function(response) {
          if (chrome.runtime.lastError) {
            // Fallback to clipboard
            navigator.clipboard.writeText(emoji).then(() => {
              showMessage(emoji + ' copied!');
            }).catch(() => {
              showMessage('Copy failed');
            });
          } else {
            showMessage(emoji + ' inserted!');
          }
        });
      });
    }
    
    function renderEmojis(emojiList) {
      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';
      
      emojiList.forEach(({emoji, name}) => {
        const item = document.createElement('div');
        item.className = 'emoji-item';
        item.innerHTML = `
          <span class="emoji">${emoji}</span>
          <span class="emoji-name">${name}</span>
        `;
        item.addEventListener('click', () => copyEmoji(emoji));
        grid.appendChild(item);
      });
    }
    
    function filterEmojis() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      let baseEmojis = currentCategory === 'all' ? getAllEmojis() : emojis[currentCategory];
      
      if (searchTerm) {
        baseEmojis = baseEmojis.filter(item => 
          item.name.toLowerCase().includes(searchTerm)
        );
      }
      
      renderEmojis(baseEmojis);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      // Set up category buttons
      document.getElementById('categories').addEventListener('click', function(e) {
        if (e.target.classList.contains('category')) {
          document.querySelectorAll('.category').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          currentCategory = e.target.dataset.category;
          filterEmojis();
        }
      });
      
      // Set up search
      document.getElementById('searchInput').addEventListener('input', filterEmojis);
      
      // Initial render
      currentCategory = 'all';
      filterEmojis();
    });
  </script>

</html>
